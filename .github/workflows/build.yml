# Builds installers for all desktop platforms. macOS/Linux are only verified here (no local machines).
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# tauri-action creates the draft release and uploads the installers to it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: pnpm install --frozen-lockfile
      # src/generated/ and public/strokes/ are not committed: rebuild them from data/ + pinned sources.
      - run: pnpm data:fetch && pnpm data:build
      - run: pnpm check && pnpm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Tiểu Mai ${{ github.ref_name }}'
          releaseDraft: true
      # A manual run has no tag, so no release: keep the installers as run artifacts instead.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tieumai-${{ matrix.platform }}
          # target/<triple>/ when a --target is passed (the macOS universal build).
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error
