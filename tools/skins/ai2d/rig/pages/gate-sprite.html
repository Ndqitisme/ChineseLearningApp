<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>sprite v4</title>
<style>html,body{margin:0;background:#ddd}.s{width:139px;height:340px;overflow:hidden}img{display:block;max-width:none;will-change:transform;width:1390px}</style></head><body>
<div class="s"><img id="i" src="/app/sheet.webp"></div>
<script type="module">
// Baseline: the shipped sprite path with src/lib/sprite timings. Sprite.svelte shows one cell by translate3d
// and schedules frame steps with setTimeout only while an animation runs; Pet.svelte idleLoop picks
// blink 55 % / breathe 20 % / look 15 % / wink 10 % every 3-7 s. Seeded RNG so runs compare.
// (restTransitions recovery steps are left out: they add a few steps of 120-220 ms, inferred minor.)
const skin = await (await fetch('/app/skin.json')).json();
const img = document.getElementById('i');
await img.decode();
let a = 12345 >>> 0; const rnd = () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
let draws = 0, timer;
const show = (f) => { img.style.transform = `translate3d(${-(f % skin.columns) * 139}px,${-Math.floor(f / skin.columns) * 340}px,0)`; draws++; };
function play(name) {
  clearTimeout(timer);
  const steps = skin.animations[name] ?? skin.animations.idle; let i = 0;
  const step = () => { const [f, ms] = steps[i++]; show(f); if (ms === 0 || i >= steps.length) return; timer = setTimeout(step, ms); };
  step();
}
function idleLoop() { setTimeout(() => { const r = rnd(); play(r < 0.55 ? 'blink' : r < 0.75 ? 'breathe' : r < 0.9 ? 'look' : 'wink'); idleLoop(); }, 3000 + rnd() * 4000); }
show(0); idleLoop();
window.draws = () => draws;
window.ready = true;
</script></body></html>
