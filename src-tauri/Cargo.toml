[package]
name = "tieumai"
version = "0.1.0"
description = "Ứng dụng desktop học từ vựng tiếng Trung cho người Việt, với trợ lý 3D chạy nền ở cạnh màn hình"
repository = "https://github.com/Ndqitisme/ChineseLearningApp"
authors = ["Tiểu Mai contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "tieumai_lib"
# Mobile builds need "staticlib" (iOS) and "cdylib" (Android); add them back at the mobile
# milestone. They are left out on desktop because the windows-gnu linker fails on a cdylib
# this large ("export ordinal too large").
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-store = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }
